<!DOCTYPE html>
<html lang="en">
<head>

<title>Signed Out | Eagle Graphics Project Hub</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link href="https://fonts.googleapis.com/css2?family=Jost:wght@600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

<body>
<main>
  <p class="eyebrow">Eagle Graphics Project Hub</p>
  <h1>You're Signed Out</h1>
