<title>Design Prompt Studio 2.1</title>

<style>
:root{
/* Eagle Graphics tokens on dark surfaces. Layout: sticky brand bar, lockup header, 340px input rail beside the concept column. */
--eg-green-300:#b2dd79;--eg-green-400:#94cf4a;--eg-green-500:#76bd1d;--eg-green-600:#5f9a17;--eg-green-700:#4a7812;--eg-green-800:#365711;--eg-green-900:#20340a;
--eg-grey-100:#f0f1f2;--eg-grey-200:#e1e3e4;--eg-grey-300:#c5c8c9;--eg-grey-400:#9ca0a2;--eg-grey-500:#7d8183;--eg-grey-600:#63676a;--eg-grey-700:#53585a;--eg-grey-800:#3a3e40;--eg-grey-900:#2a2d2e;
--danger:#c0392b;--danger-bg:#fae6e3;
--page:var(--eg-grey-900);--card:var(--eg-grey-800);--inset:var(--eg-grey-900);
--line:var(--eg-grey-700);--line-strong:var(--eg-grey-600);
--text-h:#ffffff;--text:var(--eg-grey-200);--text-muted:var(--eg-grey-300);--text-code:var(--eg-grey-100);
--fill:var(--eg-green-700);--fill-hover:var(--eg-green-800);--fill-press:var(--eg-green-900);--ring:rgba(118,189,29,.7);
--font-display:"Jost","Century Gothic","Futura",system-ui,sans-serif;
--font-body:"Open Sans","Helvetica Neue",Arial,sans-serif;
--font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--ease:cubic-bezier(.4,0,.2,1);
color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font:400 15px/1.7 var(--font-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--eg-grey-800)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,textarea,select{font-family:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
h1,h2{margin:0;font-family:var(--font-display);text-transform:uppercase;color:var(--text-h);text-wrap:balance}
h2{font-size:18px;font-weight:700;line-height:1.3;letter-spacing:.04em}
.sub{margin:0;color:var(--text-muted);font-size:13px;line-height:1.5}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--eg-grey-800);border-bottom:1px solid var(--line)}
.navin{max-width:1240px;margin:0 auto;padding-block:10px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.nb{display:flex;gap:12px;align-items:center;min-width:0}
.mark{height:30px;width:auto;flex:none;display:block}
.nb b{display:block;font:700 15px/1.2 var(--font-display);text-transform:uppercase;letter-spacing:.08em;color:var(--text-h)}
.nb small{display:block;font-size:12px;line-height:1.4;color:var(--text-muted)}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.presets>span{font:600 11px/1.5 var(--font-body);text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);margin-right:4px}
.wrap{max-width:1240px;margin:0 auto;padding-block:32px 64px}
.ph0{display:flex;flex-wrap:wrap;align-items:center;gap:24px 36px;padding-bottom:36px}
.lockup{width:150px;height:auto;flex:none;display:block}
.hd{border-left:1px solid var(--line-strong);padding-left:36px;min-width:0}
@media (max-width:600px){.hd{border-left:0;padding-left:0}}
.hd h1{font-size:clamp(28px,4.4vw,40px);font-weight:800;line-height:1.1;letter-spacing:-.01em}
.bar{width:48px;height:3px;background:var(--eg-green-500);margin:14px 0 12px}
.hd .sub{font-size:14px;line-height:1.7}
.pill{display:inline-block;font:600 11px/1 var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:var(--eg-green-300);border:1px solid var(--eg-green-600);border-radius:2px;padding:5px 8px;vertical-align:middle;margin-left:10px}
.hd .pill{margin:14px 0 0}
.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:20px;min-width:0}
.ph{position:relative;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.ph::after{content:"";position:absolute;left:0;bottom:-1px;width:48px;height:3px;background:var(--eg-green-500)}
fieldset{border:0;padding:0;margin:0 0 20px;min-width:0}
.step{margin:0 0 16px}
.step.next{margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.step .eyebrow{display:block;font:600 11px/1.4 var(--font-display);text-transform:uppercase;letter-spacing:.18em;color:var(--eg-green-400)}
.step h3{margin:3px 0 4px;font:700 15px/1.3 var(--font-display);text-transform:uppercase;letter-spacing:.04em;color:var(--text-h)}
.step .sub{font-size:11.5px;line-height:1.5}
legend{padding:0;margin-bottom:8px;font:600 11px/1.5 var(--font-display);text-transform:uppercase;letter-spacing:.18em;color:var(--text-muted)}
input[type=text],textarea{width:100%;min-height:38px;padding:7px 12px;font:400 13px/1.5 var(--font-body);color:var(--text-h);background:var(--inset);border:1px solid var(--line-strong);border-radius:3px;transition:border-color 140ms var(--ease),box-shadow 140ms var(--ease)}
textarea{resize:vertical;min-height:80px}
input::placeholder,textarea::placeholder{color:var(--eg-grey-400)}
input[type=text]:focus-visible,textarea:focus-visible{border-color:var(--eg-green-500);outline:3px solid var(--ring);outline-offset:0}
input[type=range]{width:100%;margin:6px 0 0;accent-color:var(--eg-green-500)}
.ticks{display:flex;justify-content:space-between;padding:0 6px;font-size:11px;color:var(--text-muted)}
.rd{margin-top:4px;font:700 12px/1.4 var(--font-display);letter-spacing:.04em;text-transform:uppercase;color:var(--eg-green-400)}
.chips{display:flex;flex-wrap:wrap;gap:8px 6px;margin-top:8px}
.chips:empty{display:none}
.chip{font:500 11.5px/1.35 var(--font-body);color:var(--text);background:var(--inset);border:1px solid var(--line-strong);border-radius:3px;padding:3px 10px;cursor:pointer;transition:background 140ms var(--ease),border-color 140ms var(--ease),color 140ms var(--ease)}
.chip:hover{border-color:var(--eg-green-500);color:var(--text-h)}
.chip.on{background:var(--fill);border-color:var(--eg-green-500);color:#fff;font-weight:600}
.go,.rst,.btn,.pre{cursor:pointer;border-radius:3px;transition:background 140ms var(--ease),border-color 140ms var(--ease),transform 140ms var(--ease)}
.go{width:100%;min-height:52px;border:1px solid var(--fill);background:var(--fill);color:#fff;font:700 14px/1 var(--font-display);text-transform:uppercase;letter-spacing:.1em}
.go:hover{background:var(--fill-hover);border-color:var(--fill-hover)}
.go:active{background:var(--fill-press);border-color:var(--fill-press);transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.rst,.btn,.pre{background:transparent;color:var(--text);border:1px solid var(--eg-grey-500);font:600 12px/1 var(--font-body);min-height:32px;padding:0 14px;white-space:nowrap}
.rst{width:100%;min-height:42px;margin-top:10px;font-size:13px}
.rst:hover,.btn:hover,.pre:hover{background:var(--fill);border-color:var(--fill);color:#fff}
.rst:active,.btn:active,.pre:active{background:var(--fill-press);border-color:var(--fill-press);color:#fff;transform:translateY(1px)}
.err:not(:empty){margin:12px 0 0;padding:10px 12px;font-size:13px;line-height:1.5;font-weight:600;color:var(--danger-bg);background:rgba(192,57,43,.18);border:1px solid var(--danger);border-radius:3px}
.rh{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:20px}
.rh h2::after{content:"";display:block;width:48px;height:3px;background:var(--eg-green-500);margin:10px 0 12px}
.rh .acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:32px;color:var(--text-muted)}
.empty strong{display:block;font:700 18px/1.3 var(--font-display);text-transform:uppercase;letter-spacing:.04em;color:var(--text-h);margin-bottom:6px}
.empty .wm{position:absolute;right:-24px;bottom:-34px;width:320px;max-width:70%;opacity:.06;pointer-events:none}
.empty strong,.empty{z-index:0}
.card{margin-bottom:16px}
.ct{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.num{width:28px;height:28px;border-radius:3px;display:grid;place-items:center;flex:none;font:700 13px/1 var(--font-display);color:var(--eg-green-300);border:1px solid var(--eg-green-600)}
.tt{flex:1;min-width:0}
.ctitle{font:700 16px/1.3 var(--font-display);text-transform:uppercase;letter-spacing:.03em;color:var(--text-h);overflow-wrap:anywhere}
.tt .sub{margin-top:2px}
.lbl{display:flex;justify-content:space-between;gap:10px;font:600 11px/1.5 var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:8px}
.tagc{color:var(--eg-green-400)}
.code{font:400 12.5px/1.65 var(--font-mono);color:var(--text-code);background:var(--inset);border:1px solid var(--line);border-radius:3px;padding:12px 14px;max-height:124px;overflow:auto;overflow-wrap:anywhere}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media (max-width:560px){.meta{grid-template-columns:minmax(0,1fr)}}
.box{background:var(--inset);border:1px solid var(--line);border-radius:3px;padding:10px 12px;font-size:13px;line-height:1.6;min-width:0}
.bt{display:flex;align-items:center;gap:6px;font:600 11px/1.5 var(--font-body);text-transform:uppercase;letter-spacing:.1em;color:var(--text-muted);margin-bottom:4px}
.bt svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--eg-green-500);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.go:active,.rst:active,.btn:active,.pre:active{transform:none}}
</style>

<script>
const NICHES={
"Outdoor lovers":["Trail runners","Weekend campers","Fly fishermen","Backcountry hikers","Kayak paddlers","Bird watchers"],
"Foodies":["Supper club regulars","Friday fish fry fans","Hot sauce collectors","Sourdough bakers","Taco truck chasers","Cast iron cooks"],
"Coffee & tea drinkers":["Espresso nerds","Pour-over purists","Cold brew devotees","Loose-leaf tea snobs","Latte art hobbyists","Cafe hoppers"],

  refreshNiches(true);$("#err").textContent="";empty();window.scrollTo({top:0,behavior:"smooth"});
};
document.querySelectorAll(".reset").forEach(b=>b.onclick=doReset);
const PRESETS=[
 ["Walleye Fishing",{age:"25–34",aud:"Outdoor lovers",niche:"Northwoods walleye fishing",pers:"Rugged outdoorsy",colors:"2"}],
 ["Vintage Gym",{age:"25–34",aud:"Fitness & gym",niche:"Powerlifters",pers:"Vintage Americana",colors:"2"}],
 ["Trail Running",{age:"25–34",aud:"Outdoor lovers",niche:"Trail runners",pers:"Minimalist & clean",colors:"1"}],
 ["Tech Workers",{age:"25–34",aud:"Remote workers & techies",niche:"Software engineers",pers:"Nerdy & clever",colors:"3"}]];
PRESETS.forEach(([name,v])=>{
  const b=el("button","pre",name);b.type="button";
  b.onclick=()=>{
    ["age","aud","pers","colors"].forEach(k=>state[k].inp.value=v[k]);state.place.inp.value=v.place||"Full Front (12×12 in)";
    refreshNiches();state.niche.inp.value=v.niche;
    FIELDS.forEach(f=>state[f.k].mark());generate();
  };
  $("#presets").appendChild(b);
});
empty();
</script>
