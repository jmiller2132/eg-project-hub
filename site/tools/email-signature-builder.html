    // document mints the blobs for its OWN frames, obtaining page text

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&

        // ('__proto__', 'constructor') — an unshaped key would reach

    // consumers read these Blobs directly. Survives the swap like the error sink.

      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    document.documentElement.replaceWith(doc.documentElement);

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        }
      }

        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');

      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  --eg-warning:#D98800;\n  --eg-warning-bg:#FDF1DC;\n  --eg-danger:#C0392B;\n  --eg-danger-bg:#FAE6E3;\n  --eg-info:#2A6FA8;\n  --eg-info-bg:#E5EEF6;\n\n  /* ---- Semantic aliases: use these in components ---- */\n  /* Bright PMS 368 green is an ACCENT (underscores, icons, indicators, keylines).\n     Filled controls that carry white text use the deep ramp so text clears 4.5:1. */\n  --brand:var(--eg-green-500);\n  --brand-fill:var(--eg-green-700);\n  --brand-fill-hover:var(--eg-green-800);\n  --brand-fill-press:var(--eg-green-900);\n  --brand-indicator:var(--eg-green-600);\n  --brand-hover:var(--eg-green-600);\n  --brand-press:var(--eg-green-700);\n  --brand-tint:var(--eg-green-100);\n  --brand-ink:var(--eg-green-800);\n\n  --text-heading:var(--eg-grey-900);\n  --text-body:var(--eg-grey-700);\n  /* grey-600 (5.6:1 on white, 5.0:1 on surface-subtle) — grey-500 was 3.9:1 and failed AA at body size. */\n  --text-muted:var(--eg-grey-600);\n  --text-inverse:var(--eg-white);\n  --text-brand:var(--eg-green-700);\n  --text-link:var(--eg-green-700);\n  --text-link-hover:var(--eg-green-700);\n\n  --surface-page:var(--eg-white);\n  --surface-sunken:var(--eg-grey-100);\n  --surface-card:var(--eg-white);\n  --surface-inverse:var(--eg-grey-900);\n  --surface-brand:var(--eg-green-500);\n  --surface-overlay:rgba(20,21,22,.62);\n\n  --border-subtle:var(--eg-grey-200);\n  --border-default:var(--eg-grey-300);\n  --border-strong:var(--eg-grey-500);\n  --border-brand:var(--eg-green-600);\n  --focus-ring:rgba(118,189,29,.40);\n}\n<\u002Fstyle>\n  <style>/* Eagle Graphics — typography.\n   Display face is squared/geometric, always UPPERCASE with tight tracking (logo DNA).\n   Body face is a humanist sans at normal case. */\n:root{\n  --font-display:\"Jost\",\"Century Gothic\",\"Futura\",system-ui,sans-serif;\n  --font-body:\"Open Sans\",\"Helvetica Neue\",Arial,sans-serif;\n  --font-mono:\"IBM Plex Mono\",ui-monospace,Menlo,monospace;\n\n  /* Type scale — 1.25 ratio off a 16px base */\n  --text-3xs:11px;\n  --text-2xs:12px;\n  --text-xs:13px;\n  --text-sm:14px;\n  --text-base:16px;\n  --text-md:18px;\n  --text-lg:21px;\n  --text-xl:26px;\n  --text-2xl:32px;\n  --text-3xl:40px;\n  --text-4xl:52px;\n  --text-5xl:66px;\n\n  --leading-tight:1.05;\n  --leading-snug:1.2;\n  --leading-normal:1.5;\n  --leading-relaxed:1.7;\n\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n  --weight-bold:700;\n  --weight-black:800;\n\n  --tracking-tight:-0.01em;\n  --tracking-normal:0;\n  --tracking-wide:0.04em;\n  --tracking-wider:0.10em;\n  --tracking-widest:0.18em;\n\n  /* Semantic roles */\n  --type-hero-family:var(--font-display);\n  --type-hero-size:var(--text-5xl);\n  --type-hero-weight:var(--weight-black);\n  --type-hero-leading:var(--leading-tight);\n  --type-hero-tracking:var(--tracking-tight);\n\n  --type-h1-size:var(--text-4xl);\n  --type-h2-size:var(--text-3xl);\n  --type-h3-size:var(--text-xl);\n  --type-eyebrow-size:var(--text-2xs);\n  --type-eyebrow-tracking:var(--tracking-widest);\n  --type-body-size:var(--text-base);\n  --type-body-leading:var(--leading-relaxed);\n  --type-caption-size:var(--text-xs);\n}\n<\u002Fstyle>\n  <style>/* Eagle Graphics — spacing on a 4px base. */\n:root{\n  --space-0:0px;\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:20px;\n  --space-6:24px;\n  --space-8:32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-16:64px;\n  --space-20:80px;\n  --space-24:96px;\n  --space-32:128px;\n\n  /* Layout */\n  --container-max:1240px;\n  --container-narrow:820px;\n  --gutter:var(--space-6);\n  --section-y:var(--space-20);\n  --section-y-tight:var(--space-12);\n  --control-h-sm:32px;\n  --control-h-md:42px;\n  --control-h-lg:52px;\n}\n<\u002Fstyle>\n  <style>/* Eagle Graphics — corner radii. Squared-off, industrial: small radii only.\n   Nothing is pill-shaped except deliberate status badges. */\n:root{\n  --radius-none:0px;\n  --radius-xs:2px;\n  --radius-sm:3px;\n  -- rmat('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Eagle Graphics — color system.\n   Brand green #76BD1D (PMS 368, CMYK 59/2/100/0) and brand grey #53585A\n   (PMS 425, CMYK 65/56/53/29) are the confirmed brand values, supplied by Eagle\n   Graphics. Ramps are built around those two anchors. */\n:root{\n  /* Brand green ramp */\n  --eg-green-50:#F5FBEC;\n  --eg-green-100:#E9F6D6;\n  --eg-green-200:#D1EBAC;\n  --eg-green-300:#B2DD79;\n  --eg-green-400:#94CF4A;\n  --eg-green-500:#76BD1D;\n  --eg-green-600:#5F9A17;\n  --eg-green-700:#4A7812;\n  --eg-green-800:#365711;\n  --eg-green-900:#20340A;\n\n  /* Brand grey ramp (cool, slightly blue-leaning — matches logo grey) */\n  --eg-grey-50:#F7F8F8;\n  --eg-grey-100:#F0F1F2;\n  --eg-grey-200:#E1E3E4;\n  --eg-grey-300:#C5C8C9;\n  --eg-grey-400:#9CA0A2;\n  --eg-grey-500:#7D8183;\n  --eg-grey-600:#63676A;\n  --eg-grey-700:#53585A;\n  --eg-grey-800:#3A3E40;\n  --eg-grey-900:#2A2D2E;\n  --eg-black:#141516;\n  --eg-white:#FFFFFF;\n\n  /* Semantic status */\n  --eg-success:#1F8A4C;\n  --eg-success-bg:#E4F3EA;\n  --eg-warning:#D98800;\n  --eg-warning-bg:#FDF1DC;\n  --eg-danger:#C0392B;\n  --eg-danger-bg:#FAE6E3;\n  --eg-info:#2A6FA8;\n  --eg-info-bg:#E5EEF6;\n\n  /* ---- Semantic aliases: use these in components ---- */\n  /* Bright PMS 368 green is an ACCENT (underscores, icons, indicators, keylines).\n     Filled controls that carry white text use the deep ramp so text clears 4.5:1. */\n  --brand:var(--eg-green-500);\n  --brand-fill:var(--eg-green-700);\n  --brand-fill-hover:var(--eg-green-800);\n  --brand-fill-press:var(--eg-green-900);\n  --brand-indicator:var(--eg-green-600);\n  --brand-hover:var(--eg-green-600);\n  --brand-press:var(--eg-green-700);\n  --brand-tint:var(--eg-green-100);\n  --brand-ink:var(--eg-green-800);\n\n  --text-heading:var(--eg-grey-900);\n  --text-body:var(--eg-grey-700);\n  /* grey-600 (5.6:1 on white, 5.0:1 on surface-subtle) — grey-500 was 3.9:1 and failed AA at body size. */\n  --text-muted:var(--eg-grey-600);\n  --text-inverse:var(--eg-white);\n  --text-brand:var(--eg-green-700);\n  --text-link:var(--eg-green-700);\n  --text-link-hover:var(--eg-green-700);\n\n  --surface-page:var(--eg-white);\n  --surface-sunken:var(--eg-grey-100);\n  --surface-card:var(--eg-white);\n  --surface-inverse:var(--eg-grey-900);\n  --surface-brand:var(--eg-green-500);\n  --surface-overlay:rgba(20,21,22,.62);\n\n  --border-subtle:var(--eg-grey-200);\n  --border-default:var(--eg-grey-300);\n  --border-strong:var(--eg-grey-500);\n  --border-brand:var(--eg-green-600);\n  --focus-ring:rgba(118,189,29,.40);\n}\n\n/* Eagle Graphics — typography.\n   Display face is squared/geometric, always UPPERCASE with tight tracking (logo DNA).\n   Body face is a humanist sans at normal case. */\n:root{\n  --font-display:\"Jost\",\"Century Gothic\",\"Futura\",system-ui,sans-serif;\n  --font-body:\"Open Sans\",\"Helvetica Neue\",Arial,sans-serif;\n  --font-mono:\"IBM Plex Mono\",ui-monospace,Menlo,monospace;\n\n  /* Type scale — 1.25 ratio off a 16px base */\n  --text-3xs:11px;\n  --text-2xs:12px;\n  --text-xs:13px;\n  --text-sm:14px;\n  --text-base:16px;\n  --text-md:18px;\n  --text-lg:21px;\n  --text-xl:26px;\n  --text-2xl:32px;\n  --text-3xl:40px;\n  --text-4xl:52px;\n  --text-5xl:66px;\n\n  --leading-tight:1.05;\n  --leading-snug:1.2;\n  --leading-normal:1.5;\n  --leading-relaxed:1.7;\n\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n  --weight-bold:700;\n  --weight-black:800;\n\n  --tracking-tight:-0.01em;\n  --tracking-normal:0;\n  --tracking-wide:0.04em;\n  --tracking-wider:0.10em;\n  --tracking-widest:0.18em;\n\n  /* Semantic roles */\n  --type-hero-family:var(--font-display);\n  --type-hero-size:var(--text-5xl);\n  --type-hero-weight:var(--weight-black);\n  --type-hero-leading:var(--leading-tight);\n  --type-hero-tracking:var(--tracking-tight);\n\n  --type-h1-size:var(--text-4xl);\n  --type-h2-size:var(--text-3xl);\n  --type-h3-size:var(--text-xl);\n  --type-eyebrow-size:var(--text-2xs);\n  --type-eyebrow-tracking:var(--tracking-widest);\n  --type-body-size:var(--text-base);\n  --type-body-leading:var(--leading-relaxed);\n  --type-caption-size:var(--text-xs);\n}\n\n/* Eagle Graphics — spacing on a 4px base. */\n:root{\n  --space-0:0px;\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:20px;\n  --space-6:24px;\n  --space-8:32px;\n  --space-10:40px;\n  --space-12:48px;\n  --space-16:64px;\n  --space-20:80px;\n  --space-24:96px;\n  --space-32:128px;\n\n  /* Layout */\n  --container-max:1240px;\n  --container-narrow:820px;\n  --gutter:var(--space-6);\n  --section-y:var(--space-20);\n  --section-y-tight:var(--space-12);\n  --control-h-sm:32px;\n  --control-h-md:42px;\n  --control-h-lg:52px;\n}\n\n/* Eagle Graphics — corner radii. Squared-off, industrial: small radii only.\n   Nothing is pill-shaped except deliberate status badges. */\n:root{\n  --radius-none:0px;\n  --radius-xs:2px;\n  --radius-sm:3px;\n  --radius-md:4px;\n  --radius-lg:6px;\n  --radius-pill:999px;\n  --radius-control:var(--radius-sm);\n  --radius-card:var(--radius-md);\n  --radius-media:var(--radius-xs);\n}\n\n/* Eagle Graphics — elevation. Shadows are neutral-grey, never tinted green,\n   and stay tight; the brand reads as print/production, not glassy software. */\n:root{\n  --shadow-none:none;\n  --shadow-xs:0 1px 2px rgba(20,21,22,.06);\n  --shadow-sm:0 1px 3px rgba(20,21,22,.10);\n  --shadow-md:0 3px 10px rgba(20,21,22,.10);\n  --shadow-lg:0 10px 28px rgba(20,21,22,.14);\n  --shadow-modal:0 24px 60px rgba(20,21,22,.28);\n  --shadow-inset-top:inset 0 1px 0 rgba(255,255,255,.14);\n  --border-hairline:1px solid var(--border-subtle);\n  /* Protection gradient for text over photography */\n  --scrim-bottom:linear-gradient(to top,rgba(20,21,22,.82) 0%,rgba(20,21,22,.45) 45%,rgba(20,21,22,0) 100%); /* @kind other */\n  --scrim-full:linear-gradient(to right,rgba(20,21,22,.78) 0%,rgba(20,21,22,.35) 60%,rgba(20,21,22,0) 100%); /* @kind other */\n}\n\n/* Eagle Graphics — motion. Short, flat, functional. No bounce, no spring. */\n:root{\n  --dur-instant:80ms; /* @kind other */\n  --dur-fast:140ms; /* @kind other */\n  --dur-base:200ms; /* @kind other */\n  --dur-slow:320ms; /* @kind other */\n  --ease-standard:cubic-bezier(.4,0,.2,1); /* @kind other */\n  --ease-out:cubic-bezier(0,0,.2,1); /* @kind other */\n  --ease-in:cubic-bezier(.4,0,1,1); /* @kind other */\n  --transition-control:background-color var(--dur-fast) var(--ease-standard),border-color var(--dur-fast) var(--ease-standard),color var(--dur-fast) var(--ease-standard);\n  --transition-surface:box-shadow var(--dur-base) var(--ease-standard),transform var(--dur-base) var(--ease-standard);\n}\n\n/* Eagle Graphics — minimal element defaults. Consumers get these for free. */\n*,*::before,*::after{box-sizing:border-box}\nbody{margin:0;font-family:var(--font-body);font-size:var(--type-body-size);line-height:var(--type-body-leading);color:var(--text-body);background:var(--surface-page);-webkit-font-smoothing:antialiased}\nh1,h2,h3,h4,h5{font-family:var(--font-display);color:var(--text-heading);text-transform:uppercase;letter-spacing:var(--tracking-tight);line-height:var(--leading-snug);font-weight:var(--weight-bold);margin:0}\nh1{font-size:var(--type-h1-size)}\nh2{font-size:var(--type-h2-size)}\nh3{font-size:var(--type-h3-size)}\nh4{font-size:var(--text-md);letter-spacing:var(--tracking-wide)}\nh5{font-size:var(--text-2xs);letter-spacing:var(--type-eyebrow-tracking);color:var(--text-brand)}\np{margin:0 0 var(--space-4);text-wrap:pretty}\na{color:var(--text-link);text-decoration:none;transition:var(--transition-control)}\na:hover{color:var(--text-link-hover);text-decoration:underline}\nstrong{font-weight:var(--weight-bold);color:var(--text-heading)}\n:focus-visible{outline:3px solid var(--focus-ring);outline-offset:2px}\nhr{border:0;border-top:1px solid var(--border-subtle);margin:var(--space-8) 0}\ncode,kbd{font-family:var(--font-mono);font-size:.9em}\n\n<\u002Fstyle>\n  <script src=\"42abea31-e3c6-48fa-9021-28050930a067\"><\u002Fscript>\n  <style>body{margin:0;background:#F0F1F2;} a{color:#2A2D2E;} a:hover{color:#2A2D2E;}<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#F0F1F2;font-family:var(--font-body);color:var(--eg-grey-900);\">\n  <div style=\"height:4px;background:var(--eg-green-500);\"><\u002Fdiv>\n  <div style=\"max-width:1120px;margin:0 auto;padding:40px 24px 64px;display:flex;flex-direction:column;gap:32px;\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;\">\n      <p style=\"margin:0;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--eg-grey-700);\">Eagle Graphics · Eagle Sign &amp; Design · Eagle Fulfillment<\u002Fp>\n      <h1 style=\"margin:0;font-family:var(--font-display);font-size:34px;line-height:1.1;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;\">Email Signature Builder<\u002Fh1>\n      <div style=\"width:48px;height:3px;background:var(--eg-green-500);\"><\u002Fdiv>\n      <p style=\"margin:6px 0 0;max-width:640px;font-size:15px;line-height:1.6;color:var(--eg-grey-700);text-wrap:pretty;\">Fill in your details, pick a style, copy it, and paste it into Outlook. Your details save in this browser.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start;\">\n      <div style=\"flex:1 1 300px;max-width:380px;display:flex;flex-direction:column;gap:20px;background:#fff;border:1px solid var(--eg-grey-200);border-radius:4px;padding:24px;\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;\">\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--eg-grey-700);\">Brand You Send From<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;border:1px solid var(--eg-grey-300);border-radius:3px;overflow:hidden;\">\n            <sc-for list=\"{{ brands }}\" as=\"b\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ b.select }}\" style=\"{{ b.style }}\">{{ b.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ fields }}\" as=\"f\" hint-placeholder-count=\"5\">\n          <label style=\"display:flex;flex-direction:column;gap:6px;\">\n            <span style=\"font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--eg-grey-700);\">{{ f.label }}<\u002Fspan>\n            <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.onChange }}\" placeholder=\"{{ f.placeholder }}\" style=\"height:42px;padding:0 12px;border:1px solid var(--eg-grey-300);border-radius:3px;font-family:var(--font-body);font-size:15px;color:var(--eg-grey-900);background:#fff;outline:none;\" style-focus=\"border-color:var(--eg-green-600);box-shadow:0 0 0 3px rgba(118,189,29,.40);\">\n          <\u002Flabel>\n        <\u002Fsc-for>\n        <label style=\"display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding-top:4px;border-top:1px solid var(--eg-grey-200);padding-top:18px;\">\n          <input type=\"checkbox\" checked=\"{{ owner }}\" sc-camel-on-change=\"{{ toggleOwner }}\" style=\"width:18px;height:18px;margin:2px 0 0;accent-color:#4A7812;flex:none;\">\n          <span style=\"display:flex;flex-direction:column;gap:4px;\">\n            <span style=\"font-size:15px;font-weight:700;\">Also show sister brands<\u002Fspan>\n            <span style=\"font-size:13px;line-height:1.5;color:var(--eg-grey-700);text-wrap:pretty;\">For owners and anyone working across brands. Adds one small line linking the other two companies.<\u002Fspan>\n          <\u002Fspan>\n        <\u002Flabel>\n      <\u002Fdiv>\n\n      <div style=\"flex:2 1 520px;min-width:0;display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"display:flex;justify-content:flex-end;align-items:center;gap:12px;flex-wrap:wrap;\">\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--eg-grey-700);\">Preview<\u002Fspan>\n          <div style=\"display:flex;border:1px solid var(--eg-grey-300);border-radius:3px;overflow:hidden;\">\n            <button sc-camel-on-click=\"{{ setLight }}\" style=\"{{ lightBtn }}\">Light<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ setDark }}\" style=\"{{ darkBtn }}\">Dark Mode<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ dark }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"margin:0;font-size:13px;line-height:1.5;color:var(--eg-grey-700);text-wrap:pretty;\">Approximates how Outlook dark mode recolors text. Logos stay as they are. Copying always gives you the normal version.<\u002Fp>\n        <\u002Fsc-if>\n        <sc-for list=\"{{ styles }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"{{ s.cardStyle }}\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;\">\n              <div style=\"display:flex;gap:10px;align-items:baseline;\">\n                <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--eg-grey-600);\">{{ s.num }}<\u002Fspan>\n                <span style=\"font-family:var(--font-display);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">{{ s.label }}<\u002Fspan>\n                <span style=\"font-size:13px;color:var(--eg-grey-700);\">{{ s.desc }}<\u002Fspan>\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ s.onCopy }}\" style=\"height:38px;padding:0 16px;border:0;border-radius:3px;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--eg-green-700);\" style-hover=\"background:var(--eg-green-800);\">{{ s.copyLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"{{ previewBox }}\">\n              <div ref=\"{{ s.ref }}\"><\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ s.failed }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--eg-grey-900);\">Copying is blocked in this window. The signature is now selected, so press <strong>Ctrl+C<\u002Fstrong> (or <strong>Cmd+C<\u002Fstrong> on Mac).<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"{{ phoneCard }}\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;\">\n            <div style=\"display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;\">\n              <span style=\"font-family:var(--font-mono);font-size:12px;color:var(--eg-grey-600);\">04<\u002Fspan>\n              <span style=\"font-family:var(--font-display);font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;\">Phone App<\u002Fspan>\n              <span style=\"font-size:13px;color:var(--eg-grey-700);\">Plain text for Outlook on iPhone and Android<\u002Fspan>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ copyPhone }}\" style=\"height:38px;padding:0 16px;border:0;border-radius:3px;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--eg-green-700);\" style-hover=\"background:var(--eg-green-800);\">{{ phoneCopyLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px dashed var(--eg-grey-300);border-radius:3px;padding:20px 22px;overflow-x:auto;\">\n            <pre style=\"margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:19px;color:#2A2D2E;white-space:pre-wrap;\">{{ phoneText }}<\u002Fpre>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;line-height:1.5;color:var(--eg-grey-700);text-wrap:pretty;\">In the Outlook app, tap your profile picture, then Settings (gear) &gt; Signature, and paste it in.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:18px;background:#fff;border:1px solid var(--eg-grey-200);border-radius:4px;padding:28px;\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;\">\n        <h2 style=\"margin:0;font-family:var(--font-display);font-size:22px;font-weight:700;text-transform:uppercase;\">Add It to Outlook<\u002Fh2>\n        <div style=\"width:48px;height:3px;background:var(--eg-green-500);\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;\">\n        <sc-for list=\"{{ installs }}\" as=\"i\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:10px;\">\n            <span style=\"font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--eg-grey-900);\">{{ i.title }}<\u002Fspan>\n            <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5;color:var(--eg-grey-700);\">\n              <sc-for list=\"{{ i.steps }}\" as=\"step\" hint-placeholder-count=\"4\">\n                <li style=\"text-wrap:pretty;\">{{ step }}<\u002Fli>\n              <\u002Fsc-for>\n            <\u002Fol>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:0;padding-top:16px;border-top:1px solid var(--eg-grey-200);font-size:14px;line-height:1.6;color:var(--eg-grey-700);text-wrap:pretty;\"><strong style=\"color:var(--eg-grey-900);\">After pasting:<\u002Fstrong> if Outlook leaves an empty line above or below the signature, click on that line and press Delete. Avoid Backspace, which can remove the whole signature.<\u002Fp>\n      <p style=\"margin:0;font-size:14px;line-height:1.6;color:var(--eg-grey-700);text-wrap:pretty;\">Set it as the default for both new messages and replies. If you use Outlook on more than one device, add it on each one. The phone app needs the Phone App version above.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst MARK_URL = ''; // eagle head on egpromo.com — paste URL here to re-enable the Eagle + Line style\nconst ICON_FB = 'https://egpromo.com/wp-content/uploads/2026/10/icon-facebook-grey.png';\nconst ICON_LI = 'https://egpromo.com/wp-content/uploads/2026/10/icon-linkedin-grey.png';\nclass Component extends DCLogic {\n  KEY = 'eg-signature-builder-v2';\n  BRANDS = {\n    eg: { label: 'Eagle Graphics', web: 'egpromo.com', url: 'https://egpromo.com', logo: 'https://egpromo.com/wp-content/uploads/2026/10/EG-Logo_Green-Grey.png', mark: MARK_URL },\n    esd: { label: 'Eagle Sign & Design', web: 'goeaglesign.com', url: 'https://goeaglesign.com', logo: 'https://egpromo.com/wp-content/uploads/2026/10/EagleSign-Logo-01.png', mark: MARK_URL },\n    ef: { label: 'Eagle Fulfillment', web: 'eaglefulfillment.com', url: 'https://eaglefulfillment.com', logo: 'https://egpromo.com/wp-content/uploads/2026/10/Eagle-Fulfilment.png', mark: MARK_URL }\n  };\n  fmt = v => { let d = String(v || '').replace(/\\D/g, ''); if (d[0] === '1') d = d.slice(1); d = d.slice(0, 10);\n    return d.length > 6 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : d.length > 3 ? d.slice(0, 3) + '-' + d.slice(3) : d; };\n  state = (() => {\n    let saved = {};\n    try { saved = JSON.parse(localStorage.getItem('eg-signature-builder-v2') || '{}'); } catch (e) {}\n    return { brand: 'eg', name: '', title: '', phone: '', mobile: '', email: '', booking: '', owner: false, copied: null, failed: null, ...saved, copied: null, failed: null, dark: false, phoneCopied: false, phone: this.fmt(saved.phone), mobile: this.fmt(saved.mobile) };\n  })();\n  refs_ = { rule: React.createRef(), logo: React.createRef(), text: React.createRef(), compact: React.createRef() };\n\n  componentDidMount() { this.paint(); }\n  componentDidUpdate() {\n    this.paint();\n    const { brand, name, title, phone, mobile, email, booking, owner } = this.state;\n    try { localStorage.setItem(this.KEY, JSON.stringify({ brand, name, title, phone, mobile, email, booking, owner })); } catch (e) {}\n  }\n  paint() {\n    const f = this.state.dark ? 'invert(1) hue-rotate(180deg)' : '';\n    Object.keys(this.refs_).forEach(k => { const el = this.refs_[k].current; if (el) { el.innerHTML = this.sig(k); if (f) el.querySelectorAll('img').forEach(i => { i.style.filter = f; }); } });\n  }\n  plain() {\n    const st = this.state, B = this.BRANDS[st.brand], phone = st.phone || '920-759-1092';\n    const brand = B.label, title = st.title ? st.title + ', ' + brand : brand;\n    return [st.name || 'First Last', title, st.mobile ? 'O ' + phone + ' | M ' + st.mobile : phone, st.email || ('name@' + B.web), B.web].join('\\n');\n  }\n  copyPhone = () => {\n    const t = this.plain();\n    const done = () => { this.setState({ phoneCopied: true }); clearTimeout(this.pt); this.pt = setTimeout(() => this.setState({ phoneCopied: false }), 2500); };\n    const fallback = () => { const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); done(); };\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, fallback); else fallback();\n  };\n\n  esc = t => String(t).replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;').replace(/\"/g, '&quot;');\n\n  sig(style) {\n    const st = this.state, B = this.BRANDS[st.brand], e = this.esc;\n    const G = '#76BD1D', K = '#2A2D2E', M = '#53585A', F = 'Arial,Helvetica,sans-serif';\n    const name = e(st.name || 'First Last'), title = st.title ? e(st.title) : '';\n    const phone = st.phone || '920-759-1092', email = e(st.email || ('name@' + B.web));\n    const pipe = `<span style=\"color:#C5C8C9;\">&nbsp;&nbsp;|&nbsp;&nbsp;<\u002Fspan>`;\n    const tel = n => `<a href=\"tel:${n.replace(/[^\\d+]/g, '')}\" style=\"color:${K};text-decoration:none;\">${e(n)}<\u002Fa>`;\n    const phones = st.mobile ? `O&nbsp;${tel(phone)}${pipe}M&nbsp;${tel(st.mobile)}` : tel(phone);\n    const mail = `<a href=\"mailto:${email}\" style=\"color:${K};text-decoration:none;\">${email}<\u002Fa>`;\n    const web = `<a href=\"${B.url}\" style=\"color:${K};font-weight:bold;text-decoration:none;\">${B.web}<\u002Fa>`;\n    const others = Object.entries(this.BRANDS).filter(([k]) => k !== st.brand)\n      .map(([, o]) => `<a href=\"${o.url}\" style=\"color:${M};text-decoration:none;\">${o.label.replace('&', '&amp;')}<\u002Fa>`).join(' &middot; ');\n    const bk = (st.booking || '').trim(); const bkUrl = bk && !/^https?:\\/\\//i.test(bk) ? 'https://' + bk : bk;\n    const book = bk ? `<br><a href=\"${e(bkUrl)}\" style=\"color:${K};font-weight:bold;text-decoration:underline;text-decoration-color:${G};\">Book a call with me<\u002Fa>` : '';\n    const sister = st.owner ? `<br><span style=\"font-size:11px;line-height:18px;color:${M};\">${others}<\u002Fspan>` : '';\n    const FB = 'https://www.facebook.com/GOeagle1/', LI = 'https://www.linkedin.com/company/eagle-graphics-llc';\n    const ico = (u, src, alt) => `<a href=\"${u}\" style=\"text-decoration:none;\"><img src=\"${src}\" width=\"16\" height=\"16\" alt=\"${alt}\" style=\"display:inline-block;width:16px;height:16px;border:0;vertical-align:-3px;\"><\u002Fa>`;\n    const socIcons = `&nbsp;&nbsp;&nbsp;${ico(FB, ICON_FB, 'Facebook')}&nbsp;&nbsp;${ico(LI, ICON_LI, 'LinkedIn')}`;\n    const dot = `<span style=\"color:#C5C8C9;\">&nbsp;&nbsp;&middot;&nbsp;&nbsp;<\u002Fspan>`;\n    const socText = `${dot}<a href=\"${FB}\" style=\"color:${K};text-decoration:none;\">Facebook<\u002Fa>${dot}<a href=\"${LI}\" style=\"color:${K};text-decoration:none;\">LinkedIn<\u002Fa>`;\n    const brand = B.label.replace('&', '&amp;');\n    const titleBrand = title ? `${title}, ${brand}` : brand;\n    const wrap = inner => `<table cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"border-collapse:collapse;font-family:${F};font-size:13px;line-height:19px;color:${K};\"><tr>${inner}<\u002Ftr><\u002Ftable><p style=\"margin:0;font-size:1px;line-height:1px;mso-line-height-rule:exactly;\">&nbsp;<\u002Fp>`;\n    if (style === 'rule') return wrap(\n      `<td valign=\"middle\" style=\"padding:0 16px 0 0;\"><img src=\"${B.mark}\" width=\"72\" height=\"40\" alt=\"${brand}\" style=\"display:block;width:72px;height:40px;border:0;\"><\u002Ftd>` +\n      `<td width=\"2\" bgcolor=\"${G}\" style=\"width:2px;min-width:2px;background-color:${G};font-size:1px;line-height:1px;\">&nbsp;<\u002Ftd><td valign=\"top\" style=\"padding:0 0 0 16px;font-family:${F};font-size:13px;line-height:19px;color:${K};\"><b style=\"font-size:15px;\">${name}<\u002Fb><br><span style=\"color:${M};\">${titleBrand}<\u002Fspan><br>${phones}<br>${mail}${pipe}${web}${book}${sister}<\u002Ftd>`);\n    if (style === 'logo') return wrap(\n      `<td valign=\"middle\" style=\"padding:0 16px 0 0;\"><img src=\"${B.logo}\" width=\"100\" height=\"69\" alt=\"${brand}\" style=\"display:block;width:100px;height:68px;border:0;\"><\u002Ftd>` +\n      `<td width=\"2\" bgcolor=\"${G}\" style=\"width:2px;min-width:2px;background-color:${G};font-size:1px;line-height:1px;\">&nbsp;<\u002Ftd><td valign=\"top\" style=\"padding:0 0 0 16px;font-family:${F};font-size:13px;line-height:19px;color:${K};\"><b style=\"font-size:15px;\">${name}<\u002Fb><br><span style=\"color:${M};\">${titleBrand}<\u002Fspan><br>${phones}<br>${mail}<br>${web}${socText}${book}${sister}<\u002Ftd>`);\n    if (style === 'text') return wrap(\n      `<td valign=\"top\" style=\"font-family:${F};font-size:13px;line-height:19px;color:${K};\"><b style=\"font-size:15px;\">${name}<\u002Fb>${title ? `<br><span style=\"color:${M};\">${title}<\u002Fspan>` : ''}<br><b>${brand}<\u002Fb><br>${phones}${pipe}${mail}<br>${web}${socText}${book}${sister}<\u002Ftd>`);\n    return wrap(\n      `<td valign=\"top\" style=\"font-family:${F};font-size:13px;line-height:19px;color:${K};\"><b>${name}<\u002Fb>${title ? `${pipe}<span style=\"color:${M};\">${title}<\u002Fspan>` : ''}${pipe}<b>${brand}<\u002Fb><br>${tel(phone)}${pipe}${mail}${pipe}${web}<\u002Ftd>`);\n  }\n\n  copy(id) {\n    const el = this.refs_[id].current; if (!el) return;\n    el.innerHTML = this.sig(id);\n    const range = document.createRange(); range.selectNodeContents(el);\n    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);\n    let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}\n    if (ok) { sel.removeAllRanges(); this.setState({ copied: id, failed: null }); clearTimeout(this.t); this.t = setTimeout(() => this.setState({ copied: null }), 2500); }\n    else this.setState({ failed: id, copied: null });\n    if (this.state.dark) setTimeout(() => this.paint(), 0);\n  }\n\n  renderVals() {\n    const st = this.state, B = this.BRANDS[st.brand];\n    const set = k => ev => this.setState({ [k]: (k === 'phone' || k === 'mobile') ? this.fmt(ev.target.value) : ev.target.value, copied: null, failed: null });\n    const seg = on => ({ height: 34, padding: '0 14px', border: 0, cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: 14, fontWeight: on ? 700 : 400, background: on ? 'var(--eg-grey-900)' : '#fff', color: on ? '#fff' : 'var(--eg-grey-900)' });\n    const F = [\n      ['name', 'Full Name', 'First Last'], ['title', 'Title (optional)', 'Leave blank to hide'],\n      ['phone', 'Office Phone', '920-759-1092'], ['mobile', 'Mobile (optional)', '999-999-9999 or leave blank'], ['email', 'Email', 'name@' + B.web], ['booking', 'Booking Link (optional)', 'calendly.com/your-name']\n    ];\n    const S = [['logo', 'Logo + Line', 'Full ' + B.label + ' logo and a green line'], ['text', 'Text Only', 'No images, five short lines'], ['compact', 'Compact Reply', 'Two lines for replies and internal email']];\n    return {\n      dark: st.dark, setLight: () => this.setState({ dark: false }), setDark: () => this.setState({ dark: true }),\n      lightBtn: seg(!st.dark), darkBtn: seg(st.dark),\n      previewBox: { background: '#fff', border: '1px dashed var(--eg-grey-300)', borderRadius: 3, padding: '20px 22px', overflowX: 'auto', filter: st.dark ? 'invert(1) hue-rotate(180deg)' : 'none' },\n      phoneText: this.plain(), copyPhone: this.copyPhone, phoneCopyLabel: st.phoneCopied ? 'Copied' : 'Copy Text',\n      phoneCard: { display: 'flex', flexDirection: 'column', gap: 14, padding: 20, background: 'var(--eg-grey-100)', border: '1px solid ' + (st.phoneCopied ? 'var(--eg-green-600)' : 'var(--eg-grey-200)'), borderRadius: 4 },\n      brands: Object.entries(this.BRANDS).map(([id, b], i) => ({\n        label: b.label, select: () => this.setState({ brand: id, copied: null, failed: null }),\n        style: { padding: '11px 14px', border: 0, borderTop: i ? '1px solid var(--eg-grey-200)' : 0, textAlign: 'left', cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: 15, fontWeight: st.brand === id ? 700 : 400, background: st.brand === id ? 'var(--eg-grey-900)' : '#fff', color: st.brand === id ? '#fff' : 'var(--eg-grey-900)' }\n      })),\n      fields: F.map(([k, label, ph]) => ({ label, placeholder: ph, value: st[k] || '', onChange: set(k) })),\n      owner: !!st.owner, toggleOwner: ev => this.setState({ owner: ev.target.checked, copied: null, failed: null }),\n      styles: S.map(([id, label, desc], i) => ({\n        num: '0' + (i + 1), label, desc, ref: this.refs_[id], failed: st.failed === id,\n        copyLabel: st.copied === id ? 'Copied' : 'Copy Signature', onCopy: () => this.copy(id),\n        cardStyle: { display: 'flex', flexDirection: 'column', gap: 14, padding: 20, background: 'var(--eg-grey-100)', border: '1px solid ' + (st.copied === id ? 'var(--eg-green-600)' : 'var(--eg-grey-200)'), borderRadius: 4 }\n      })),\n      installs: [\n        { title: 'Classic Outlook (Windows)', steps: ['File > Options > Mail > Signatures', 'Click New and name it', 'Click in the box and paste (Ctrl+V)', 'Pick it for New messages and Replies/forwards, then OK'] },\n        { title: 'New Outlook & Outlook on the Web', steps: ['Settings (gear) > Accounts > Signatures', 'Click + New signature and name it', 'Paste into the box (Ctrl+V)', 'Set it as default for new messages and replies, then Save'] },\n        { title: 'Outlook for Mac', steps: ['Outlook > Settings > Signatures', 'Click + and name it', 'Paste into the box (Cmd+V)', 'Close, then choose it under Default signatures'] }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
